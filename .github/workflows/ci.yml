name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-axcl-x86:
    name: AXCL x86 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget

      - name: Build (AXCL x86)
        run: |
          chmod +x ./build_axcl_x86.sh
          bash -euxo pipefail ./build_axcl_x86.sh

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-x86-artifacts
          path: |
            build_x86/install/**
            build_x86/main_axcl* 

  build-ax650-aarch64:
    name: AX650 aarch64 cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget

      - name: Build (AX650 aarch64)
        run: |
          chmod +x ./build_ax650.sh
          bash -euxo pipefail ./build_ax650.sh

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ax650-aarch64-artifacts
          path: |
            build/install/**
            build/main* 

  build-axcl-aarch64:
    name: AXCL aarch64 cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget

      - name: Build (AXCL aarch64)
        run: |
          chmod +x ./build_axcl_aarch64.sh
          bash -euxo pipefail ./build_axcl_aarch64.sh

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-aarch64-artifacts
          path: |
            build_aarch64/install/**
            build_aarch64/main_axcl* 
