name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-axcl-x86:
    name: AXCL x86 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget

      - name: Build (AXCL x86)
        run: |
          chmod +x ./build_axcl_x86.sh
          bash -euxo pipefail ./build_axcl_x86.sh

      - name: Tokenizer smoke (AXCL x86)
        run: |
          ./build_x86/install/bin/tokenizer_smoke

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-x86-artifacts
          path: |
            build_x86/install/**
            build_x86/main_axcl* 

  build-axcl-windows-mingw64:
    name: AXCL Windows (mingw64) build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            curl
            unzip

      - name: Build (AXCL Windows mingw64)
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          build_dir=build_mingw64
          mkdir -p "${build_dir}"
          cd "${build_dir}"

          axcl_url="https://github.com/ZHEQIUSHUI/assets/releases/download/ax_3.6.2/axcl_win_x64_3.12.0.zip"
          axcl_zip="axcl_win_x64_3.12.0.zip"
          axcl_root="axcl_win_x64_3.12.0"

          curl -L -o "${axcl_zip}" "${axcl_url}"
          unzip -q "${axcl_zip}" -d "${axcl_root}"

          cmake -S .. -B . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_AX650=OFF \
            -DBUILD_AXCL=ON \
            -DAXCL_DIR="${PWD}/${axcl_root}"
          cmake --build . -j 2

      - name: Tokenizer smoke (Windows mingw64)
        shell: msys2 {0}
        run: |
          ./build_mingw64/tokenizer_smoke.exe

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-windows-mingw64-artifacts
          path: |
            build_mingw64/axllm.exe
            build_mingw64/tokenizer_smoke.exe

  build-ax650-aarch64:
    name: AX650 aarch64 cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget

      - name: Build (AX650 aarch64)
        run: |
          chmod +x ./build_ax650.sh
          bash -euxo pipefail ./build_ax650.sh

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ax650-aarch64-artifacts
          path: |
            build/install/**
            build/main* 

  build-axcl-aarch64:
    name: AXCL aarch64 cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget

      - name: Build (AXCL aarch64)
        run: |
          chmod +x ./build_axcl_aarch64.sh
          bash -euxo pipefail ./build_axcl_aarch64.sh

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-aarch64-artifacts
          path: |
            build_aarch64/install/**
            build_aarch64/main_axcl* 

  build-axcl-riscv64:
    name: AXCL riscv64 cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential unzip wget xz-utils

      - name: Build (AXCL riscv64)
        run: |
          set -euxo pipefail

          build_dir=build_riscv64
          mkdir -p "${build_dir}"
          cd "${build_dir}"

          axcl_url="https://github.com/ZHEQIUSHUI/assets/releases/download/risc-v/axcl_linux_riscv_3.14.0.zip"
          axcl_zip="axcl_linux_riscv_3.14.0.zip"
          axcl_root="axcl_linux_riscv"
          axcl_dir="${PWD}/${axcl_root}"

          if [ ! -d "${axcl_root}" ]; then
            wget -O "${axcl_zip}" "${axcl_url}"
            unzip -q "${axcl_zip}"
          fi

          tc_url="https://github.com/ZHEQIUSHUI/assets/releases/download/risc-v/gcc-14.3-riscv64-unknown-linux-gnu-2.39.tar.xz"
          tc_tar="gcc-14.3-riscv64-unknown-linux-gnu-2.39.tar.xz"
          tc_root="gcc-14.3-riscv64-unknown-linux-gnu-2.39"
          if [ ! -d "${tc_root}" ]; then
            wget -O "${tc_tar}" "${tc_url}"
            tar -xf "${tc_tar}"
          fi
          export PATH="${PWD}/${tc_root}/bin:${PATH}"

          cmake -S .. -B . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_AX650=OFF \
            -DBUILD_AXCL=ON \
            -DAXCL_DIR="${axcl_dir}" \
            -DRISCV64_TOOLCHAIN_BIN="${PWD}/${tc_root}/bin" \
            -DCMAKE_TOOLCHAIN_FILE=../toolchains/riscv64-unknown-linux-gnu.toolchain.cmake
          cmake --build . -j 8
          cmake --install .

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-riscv64-artifacts
          path: |
            build_riscv64/install/**

  publish-latest-release:
    name: Publish build artifacts to Release (latest)
    needs:
      - build-axcl-x86
      - build-axcl-windows-mingw64
      - build-ax650-aarch64
      - build-axcl-aarch64
      - build-axcl-riscv64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/axllm' && github.repository == 'AXERA-TECH/ax-llm' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          tar -C artifacts/axcl-x86-artifacts/build_x86/install -czf dist/axllm-axcl-linux-amd64.tar.gz .
          tar -C artifacts/axcl-aarch64-artifacts/build_aarch64/install -czf dist/axllm-axcl-linux-arm64.tar.gz .
          tar -C artifacts/ax650-aarch64-artifacts/build/install -czf dist/axllm-ax650-linux-arm64.tar.gz .
          tar -C artifacts/axcl-riscv64-artifacts/build_riscv64/install -czf dist/axllm-axcl-linux-riscv64.tar.gz .

          # Also publish standalone binaries for convenience.
          cp -a artifacts/axcl-x86-artifacts/build_x86/install/bin/axllm dist/axllm-axcl-linux-amd64
          cp -a artifacts/axcl-aarch64-artifacts/build_aarch64/install/bin/axllm dist/axllm-axcl-linux-arm64
          cp -a artifacts/ax650-aarch64-artifacts/build/install/bin/axllm dist/axllm-ax650-linux-arm64
          cp -a artifacts/axcl-riscv64-artifacts/build_riscv64/install/bin/axllm dist/axllm-axcl-linux-riscv64

          mkdir -p dist/windows
          cp -a artifacts/axcl-windows-mingw64-artifacts/build_mingw64/axllm.exe dist/windows/
          cp -a artifacts/axcl-windows-mingw64-artifacts/build_mingw64/tokenizer_smoke.exe dist/windows/
          (cd dist/windows && zip -r ../axllm-axcl-windows-mingw64.zip .)
          rm -rf dist/windows

      - name: Generate release notes
        shell: bash
        run: |
          set -euxo pipefail

          cat > release_body.md <<'EOF'
          This is a rolling release for branch `axllm`. Assets in this release are overwritten on each push to `axllm`.

          ## Fixed download links

          All assets can be downloaded via:

          - `https://github.com/AXERA-TECH/ax-llm/releases/latest/download/<asset_name>`

          ## Docker images (offline)

          Images are exported as **both**:

          - `.tar` (no gzip required on target devices)
          - `.tar.gz` (smaller)

          Assets:

          - `axllm-axcl-amd64.tar` / `axllm-axcl-amd64.tar.gz`
          - `axllm-axcl-arm64.tar` / `axllm-axcl-arm64.tar.gz`
          - `axllm-ax650-arm64.tar` / `axllm-ax650-arm64.tar.gz`

          Load:

          ```bash
          docker load -i axllm-axcl-amd64.tar
          # or
          docker load -i axllm-axcl-amd64.tar.gz
          ```

          Run (AXCL / PCIe):

          - Host must have AXCL driver installed and device nodes present.
          - Quick start (simplest): use `--privileged`.
          - If you prefer not to use `--privileged`, map devices explicitly:
            - `--device=/dev/axcl_host`
            - `--device=/dev/ax_mmb_dev`

          ```bash
          docker run --rm --network host \
            --device=/dev/axcl_host \
            --device=/dev/ax_mmb_dev \
            -v /path/to/models:/models \
            <loaded-image-tag> serve /models/<model_dir> --port 8000
          ```

          Run (AX650 board):

          ```bash
          docker run --rm --network host --privileged \
            -v /soc:/soc:ro \
            -e LD_LIBRARY_PATH=/soc/lib:$LD_LIBRARY_PATH \
            -v /path/to/models:/models \
            <loaded-image-tag> serve /models/<model_dir> --port 8000
          ```

          ## Native build artifacts

          - `axllm-axcl-linux-amd64.tar.gz`
          - `axllm-axcl-linux-amd64` (standalone binary)
          - `axllm-axcl-linux-arm64.tar.gz`
          - `axllm-axcl-linux-arm64` (standalone binary)
          - `axllm-ax650-linux-arm64.tar.gz`
          - `axllm-ax650-linux-arm64` (standalone binary)
          - `axllm-axcl-linux-riscv64.tar.gz`
          - `axllm-axcl-linux-riscv64` (standalone binary)
          - `axllm-axcl-windows-mingw64.zip`

          Example:

          ```bash
          tar -xf axllm-axcl-linux-amd64.tar.gz
          ./bin/axllm --help
          ```
          EOF

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          make_latest: true
          overwrite_files: true
          body_path: release_body.md
          files: |
            dist/axllm-axcl-linux-amd64.tar.gz
            dist/axllm-axcl-linux-amd64
            dist/axllm-axcl-linux-arm64.tar.gz
            dist/axllm-axcl-linux-arm64
            dist/axllm-ax650-linux-arm64.tar.gz
            dist/axllm-ax650-linux-arm64
            dist/axllm-axcl-linux-riscv64.tar.gz
            dist/axllm-axcl-linux-riscv64
            dist/axllm-axcl-windows-mingw64.zip
